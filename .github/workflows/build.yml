name: Build Pond package

run-name: Build ${{ inputs.package_path }} @ ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      package_path:
        description: "Updated package directory"
        required: true
        type: string
      source_sha:
        description: "Exact Pond main commit to build"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-build-${{ inputs.package_path }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    permissions:
      contents: read

    steps:
      - name: Install workflow dependencies
        run: pacman -Syu --needed --noconfirm git jq sudo

      - name: Check out the updated Pond commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure build user
        run: |
          useradd --create-home builder
          printf 'builder ALL=(root) NOPASSWD: /usr/bin/pacman\n' >/etc/sudoers.d/pond-builder
          chmod 0440 /etc/sudoers.d/pond-builder
          install -d -o builder -g builder pond-artifacts
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        env:
          PACKAGE_PATH: ${{ inputs.package_path }}
        run: |
          sudo -u builder -H \
            .github/scripts/build-package.sh \
              "$PACKAGE_PATH" "pond-artifacts/$PACKAGE_PATH"

      - name: Upload package files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pond-packages-${{ inputs.package_path }}-${{ inputs.source_sha }}
          path: pond-artifacts/
          if-no-files-found: error
          retention-days: 30

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download package files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pond-packages-${{ inputs.package_path }}-${{ inputs.source_sha }}
          path: pond-artifacts

      - name: Attest package files and manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            pond-artifacts/**/*.pkg.tar.*
            pond-artifacts/**/manifest-*.json
